<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090c0a" />
    <title>Create Account | GymBuddy</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="navbar public-nav">
  <a href="index.html" class="logo">Gym<span>Buddy</span></a>
  <nav>
    <a href="index.html">Home</a>
  </nav>
  <a class="btn btn-outline btn-small" href="login.html">Log In</a>
</header>

    <main>
      <div class="container">
        <section class="form-wrap">
          <p class="eyebrow">START YOUR JOURNEY</p>
          <h1>Create your <span class="accent">account.</span></h1>
          <p class="muted">Find your people and make every workout count.</p>

          <button class="btn btn-primary" type="button" data-google-login>
            Sign up with Google
          </button>

          <p class="notice" data-message aria-live="polite"></p>

          <p class="form-note">
            Already have an account? <a href="login.html">Log in</a>
          </p>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <span>© 2026 GymBuddy · Find your fitness community.</span>
        <span>Move together. Stay consistent.</span>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
